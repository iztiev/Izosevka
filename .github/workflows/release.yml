name: Build and release Izosevka

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check out Iosevka at matching tag
        uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          ref: ${{ github.ref_name }}
          path: iosevka

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: iosevka/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get install -y ttfautohint

      - name: Install npm dependencies
        run: npm ci
        working-directory: iosevka

      - name: Copy build plan
        run: cp private-build-plans.toml iosevka/private-build-plans.toml

      - name: Build TTFs
        run: npm run build -- ttf::IosevkaIzosevka
        working-directory: iosevka

      - name: Pack archives
        run: |
          TAG="${{ github.ref_name }}"
          DIST="iosevka/dist/IosevkaIzosevka"
          for dir in TTF TTF-Unhinted; do
            mkdir -p "out/${dir}"
            for f in "${DIST}/${dir}/"*.ttf; do
              cp "$f" "out/${dir}/$(basename "$f" | sed 's/IosevkaIzosevka/Izosevka/')"
            done
          done
          zip -j "Izosevka-${TAG}-TTF.zip"          out/TTF/*.ttf

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "Izosevka $TAG" \
            --notes "Based on [Iosevka $TAG](https://github.com/be5invis/Iosevka/releases/tag/$TAG)." \
            "Izosevka-${TAG}-TTF.zip"
